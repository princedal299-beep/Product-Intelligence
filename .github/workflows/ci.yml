name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: Run Ruff (Linter & Anti-Patterns)
        run: |
          # Check for syntax errors, undefined names, and unused imports
          ruff check . --select=E9,F63,F7,F82 --output-format=github

      - name: Run Flake8 (Syntax Verification)
        run: |
          # Stop build on fatal syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics


  security-audit:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (Full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Uncommitted / Leaked Private Keys
        run: |
          echo "Scanning workspace for exposed private RSA keys..."
          if find . -name "*.pem" -not -path "*/venv/*" | grep -E "(private|key)"; then
            echo "::error::Private key (.pem) found in repository tree! Do NOT commit private keys."
            exit 1
          else
            echo "No exposed .pem keys found in repository tree."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run Dependency Vulnerability Audit
        run: |
          # Audit requirements against known CVEs (warning mode to prevent build blocks on minor CVEs)
          pip-audit -r requirements.txt || true


  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, security-audit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      GROQ_API_KEY: "mock_ci_groq_key_12345"
      GEMINI_API_KEY: "mock_ci_gemini_key_12345"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "AdminTestPassword123!"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      MCP_TOKEN_EXPIRE_SECONDS: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install project requirements + missing runtime dependencies + test runner
          pip install -r requirements.txt
          pip install langchain-google-genai>=1.0.0 pytest-cov

      - name: Generate Fresh Ephemeral RS256 Keys for CI
        run: |
          mkdir -p api/keys
          python api/keys/generate_keys.py
          ls -la api/keys/

      - name: Seed Ephemeral Catalog Database for Tests
        run: |
          mkdir -p data/catalog
          python -c "
          import sqlite3, json
          conn = sqlite3.connect('data/catalog/catalog.sqlite3')
          conn.execute('''
              CREATE TABLE IF NOT EXISTS products (
                  product_id TEXT PRIMARY KEY,
                  faiss_id INTEGER,
                  parent_sku TEXT,
                  title TEXT,
                  price_usd REAL,
                  stock_status TEXT,
                  description TEXT,
                  image_path TEXT,
                  attributes_json TEXT,
                  search_text TEXT
              )
          ''')
          items = [
              ('SR001', 0, 'SR001', 'Oval Sapphire Ring in White Gold', 750.0, 'in stock', 'A stunning blue sapphire ring.', 'https://img.example.com/1.jpg', json.dumps({'jewelry_type': 'rings', 'stone1_name': 'sapphire', 'metal_type': 'white gold'}), 'sapphire ring white gold 750'),
              ('ER001', 1, 'ER001', 'Emerald Cut Solitaire Ring', 1200.0, 'in stock', 'Classic emerald cut ring.', 'https://img.example.com/2.jpg', json.dumps({'jewelry_type': 'rings', 'stone1_name': 'emerald', 'metal_type': 'yellow gold'}), 'emerald ring yellow gold 1200'),
              ('RR001', 2, 'RR001', 'Classic Ruby Engagement Ring', 950.0, 'in stock', 'Vibrant pigeon blood ruby ring.', 'https://img.example.com/3.jpg', json.dumps({'jewelry_type': 'rings', 'stone1_name': 'ruby', 'metal_type': 'rose gold'}), 'ruby ring rose gold 950'),
              ('DR001', 3, 'DR001', 'Diamond Halo Wedding Ring', 2500.0, 'in stock', 'Brilliant round diamond halo.', 'https://img.example.com/4.jpg', json.dumps({'jewelry_type': 'rings', 'stone1_name': 'diamond', 'metal_type': 'platinum'}), 'diamond ring platinum 2500'),
              ('GR001', 4, 'GR001', '18K Yellow Gold Band Ring', 450.0, 'in stock', 'Comfort fit classic gold wedding band.', 'https://img.example.com/5.jpg', json.dumps({'jewelry_type': 'rings', 'stone1_name': 'diamond', 'metal_type': 'gold'}), 'gold ring band 450')
          ]
          conn.executemany('INSERT OR IGNORE INTO products VALUES (?,?,?,?,?,?,?,?,?,?)', items)
          conn.commit()
          conn.close()
          print('CI test database successfully seeded.')
          "

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short


  smoke-test:
    name: Service Boot & Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install langchain-google-genai>=1.0.0

      - name: Generate Keys
        run: |
          mkdir -p api/keys
          python api/keys/generate_keys.py

      - name: Verify FastAPI Import & Initialization
        env:
          GROQ_API_KEY: "mock_ci_key"
          GEMINI_API_KEY: "mock_ci_key"
          ADMIN_EMAIL: "admin@example.com"
          ADMIN_PASSWORD: "AdminTestPassword123!"
        run: |
          python -c "
          from api.app import app
          assert app.title == 'Product Intelligence API'
          print('FastAPI application initialized successfully without errors!')
          "
